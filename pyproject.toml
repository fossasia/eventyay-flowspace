[project]
name = "eventyay-flowspace"
dynamic = ["version"]
description = "This plugin allows you to integrate Flowspace with your events"
readme = "README.rst"
license = {file = "LICENSE"}
keywords = ["Eventyay"]
authors = [
    {name = "FOSSASIA", email = "support@fossasia.org"},
]
maintainers = [
    {name = "FOSSASIA", email = "support@fossasia.org"},
]

dependencies = [
]

[project.optional-dependencies]
dev = ["ruff==0.17.0"]

[project.entry-points."pretix.plugin"]
flowspace = "flowspace:PretixPluginMeta"

[project.entry-points."distutils.commands"]
build = "pretix_plugin_build.build:CustomBuild"

[build-system]
requires = [
    "setuptools",
    "pretix-plugin-build",
]

[project.urls]
homepage = "https://github.com/fossasia/eventyay-flowspace.git"
repository = "https://github.com/fossasia/eventyay-flowspace.git"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "flowspace.__version__"}

[tool.setuptools.packages.find]
include = ["flowspace*"]
namespaces = false

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["migrations", ".ropeproject", "static", "_static", "build", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402"]

[tool.ruff.lint.pycodestyle]
max-line-length = 160

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["flowspace"]
known-third-party = ["pretix"]

[tool.ruff.lint.per-file-ignores]
"setup.py" = ["I"]
